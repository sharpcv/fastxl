name: release

# Builds the prebuilt release packages for an existing tag and attaches them to
# that tag's GitHub Release. Run it after a release has been created:
#
#   gh workflow run release.yml -f tag=v1.1.0
#
# Every job checks out the requested tag, so the packages always match the
# tagged source even though this workflow file lives on the default branch.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and attach to its GitHub Release"
        required: true

permissions:
  contents: write

env:
  XMAKE_ROOT: "y"

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: xmake-release-${{ matrix.arch }}-${{ hashFiles('xmake.lua', 'projects/*/xmake.lua', 'bindings/xmake.lua') }}
          restore-keys: xmake-release-${{ matrix.arch }}-

      - name: Install Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev pybind11-dev

      - name: Build CLI and Python module
        run: |
          xmake f -y -m release
          xmake build -y fastxl_cli fastxl_python

      - name: Package
        run: |
          # Shrink the shipped CLI/extension; ctypes hosts never load debug
          # symbols and the release zip is downloaded by end users.
          strip --strip-unneeded build/bin/fastxl
          strip --strip-unneeded build/python/fastxl/_fastxl.so
          python3 projects/tools/stage_skill.py
          python3 projects/tools/package_release.py
          version=$(python3 -c "import sys; sys.path.insert(0, 'projects/tools'); import package_release; print(package_release.read_version())")
          git archive --format=zip --prefix="fastxl-$version/" \
            -o "build/fastxl-$version-src.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: fastxl-linux-${{ matrix.arch }}
          path: build/fastxl-*.zip
          if-no-files-found: error

  # The C ABI SDK must load on glibc 2.28+ hosts, so it is built inside the
  # manylinux_2_28 image instead of the runner's Ubuntu. The host job above
  # stays on the runner for the CLI and the version-specific pybind11 module.
  sdk-linux:
    name: sdk-linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build, verify and package the SDK
        run: bash projects/tools/build_sdk_manylinux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fastxl-sdk-linux-${{ matrix.arch }}
          path: |
            build/fastxl-sdk-*.zip
            build/wheelhouse/*.whl
          if-no-files-found: error

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache@v4
        with:
          path: ~\.xmake\packages
          key: xmake-release-windows-${{ hashFiles('xmake.lua', 'projects/*/xmake.lua', 'bindings/xmake.lua') }}
          restore-keys: xmake-release-windows-

      - name: Install Python module dependencies
        run: python -m pip install pybind11

      - name: Configure
        shell: pwsh
        # FASTXL_PY_* go through GITHUB_ENV, so they only reach the next step.
        run: |
          $include = python -c "import sysconfig; print(sysconfig.get_paths()['include'])"
          $prefix = python -c "import sys; print(sys.base_prefix)"
          $pybind = python -c "import pybind11; print(pybind11.get_include())"
          $version = python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')"
          "FASTXL_PY_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FASTXL_PY_LIBDIR=$prefix\libs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FASTXL_PY_LIBRARY=python$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FASTXL_PYBIND11_INCLUDE=$pybind" | Out-File -FilePath $env:GITHUB_ENV -Append
          xmake f -y -m release -p windows -a x64

      - name: Build and package
        shell: pwsh
        run: |
          xmake build -y fastxl_cli fastxl_python fastxl
          python projects/tools/stage_skill.py
          python projects/tools/package_release.py
          python projects/tools/package_sdk.py
          python projects/tools/package_wheel.py --plat-name win_amd64 --out build/wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: fastxl-windows-x64
          path: |
            build/fastxl-*.zip
            build/wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: publish-assets
    needs: [linux, sdk-linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # upload-artifact keeps the least common parent of each job's paths,
          # so wheels arrive under wheelhouse/. Flatten them so the release
          # assets and the checksum glob are flat.
          if [ -d wheelhouse ]; then
            mv -f wheelhouse/*.whl .
            rm -rf wheelhouse
          fi
          sha256sum fastxl-*.zip fastxl-*.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The publish job has no checkout, so point gh at the repository.
          gh release upload "${{ inputs.tag }}" dist/*.zip dist/*.whl dist/SHA256SUMS.txt \
            --clobber -R "${{ github.repository }}"
